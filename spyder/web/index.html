<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spyder</title>
<style>
  :root {
    --bg:#0b0e14; --surface:#141922; --surface-2:#1b2230; --border:#262d3a;
    --text:#e6e9ef; --muted:#9aa4b8;
    --accent:#5b9dff; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --neutral:#8b93a7;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    --r1:6px; --r2:10px;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
  }
  .wrap { max-width:1200px; margin:0 auto; padding:var(--s6) var(--s4); }

  header { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s6); }
  header h1 { font-size:20px; margin:0; letter-spacing:.5px; }
  header h1 b { color:var(--accent); }
  .seed { font-family:var(--mono); font-size:13px; color:var(--muted); word-break:break-all; }
  .status { margin-left:auto; display:flex; align-items:center; gap:var(--s2); font-size:13px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--neutral); }
  .dot.ao-vivo { background:var(--ok); }
  .dot.erro { background:var(--warn); }

  .tiles { display:grid; grid-template-columns:repeat(5,1fr); gap:var(--s3); margin-bottom:var(--s6); }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:var(--r2); padding:var(--s4); }
  .tile .n { font-size:28px; font-variant-numeric:tabular-nums; line-height:1; }
  .tile .l { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-top:var(--s2); }
  .tile.page .n{color:var(--accent)} .tile.xhr .n{color:var(--ok)}
  .tile.asset .n{color:var(--neutral)} .tile.external .n{color:var(--warn)}

  .controls { display:flex; gap:var(--s3); flex-wrap:wrap; align-items:center; margin-bottom:var(--s4); }
  .busca { flex:1 1 220px; min-width:180px; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:var(--r1); padding:var(--s2) var(--s3); font-size:14px; }
  .busca::placeholder{ color:var(--muted); }
  .chips { display:flex; gap:var(--s1); flex-wrap:wrap; }
  .chip { background:var(--surface); color:var(--muted); border:1px solid var(--border);
    border-radius:999px; padding:var(--s1) var(--s3); font-size:12px; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--surface-2); color:var(--text); border-color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .tabela-box { border:1px solid var(--border); border-radius:var(--r2); overflow:hidden; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { position:sticky; top:0; background:var(--surface-2); text-align:left;
    font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    padding:var(--s2) var(--s3); white-space:nowrap; }
  tbody td { padding:var(--s2) var(--s3); border-top:1px solid var(--border); vertical-align:top; }
  tbody tr:hover { background:var(--surface); }
  td.url, td.src { font-family:var(--mono); word-break:break-all; }
  td.src { color:var(--muted); }
  td.metodo { font-family:var(--mono); color:var(--muted); white-space:nowrap; }
  td.status { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .st-2{color:var(--ok)} .st-3{color:var(--warn)} .st-4,.st-5{color:var(--err)} .st-0{color:var(--muted)}

  .badge { display:inline-block; font-size:11px; padding:1px var(--s2); border-radius:var(--r1);
    border:1px solid currentColor; white-space:nowrap; }
  .k-page{color:var(--accent)} .k-xhr{color:var(--ok)} .k-asset{color:var(--neutral)} .k-external{color:var(--warn)}

  .vazio { padding:var(--s8); text-align:center; color:var(--muted); }
  @media (max-width:720px){ .tiles{ grid-template-columns:repeat(2,1fr); } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>spyder</b></h1>
    <span class="seed" id="seed"></span>
    <span class="status"><span class="dot" id="dot"></span><span id="statusTxt">conectando…</span></span>
  </header>

  <div class="tiles">
    <div class="tile"><div class="n" id="c-total">0</div><div class="l">Total</div></div>
    <div class="tile page"><div class="n" id="c-page">0</div><div class="l">Páginas</div></div>
    <div class="tile xhr"><div class="n" id="c-xhr">0</div><div class="l">APIs (xhr)</div></div>
    <div class="tile asset"><div class="n" id="c-asset">0</div><div class="l">Assets</div></div>
    <div class="tile external"><div class="n" id="c-external">0</div><div class="l">Externos</div></div>
  </div>

  <div class="controls">
    <input class="busca" id="busca" type="search" placeholder="Filtrar por URL…" aria-label="Filtrar por URL">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por tipo">
      <button class="chip" data-k="" aria-pressed="true">Todos</button>
      <button class="chip" data-k="page" aria-pressed="false">page</button>
      <button class="chip" data-k="xhr" aria-pressed="false">xhr</button>
      <button class="chip" data-k="asset" aria-pressed="false">asset</button>
      <button class="chip" data-k="external" aria-pressed="false">external</button>
    </div>
    <div class="chips" id="chips-status" role="group" aria-label="Filtrar por status">
      <button class="chip" data-s="" aria-pressed="true">Status: todos</button>
      <button class="chip st-2" data-s="2" aria-pressed="false">2xx</button>
      <button class="chip st-3" data-s="3" aria-pressed="false">3xx</button>
      <button class="chip st-4" data-s="4" aria-pressed="false">4xx</button>
      <button class="chip st-5" data-s="5" aria-pressed="false">5xx</button>
    </div>
  </div>

  <div class="tabela-box">
    <div class="scroll">
      <table>
        <thead><tr>
          <th>Método</th><th>Tipo</th><th>URL</th><th>Origem</th><th style="text-align:right">Status</th>
        </tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <div class="vazio" id="vazio">Aguardando rotas… inicie o crawl e elas aparecem aqui ao vivo.</div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const corpo = $("corpo"), vazio = $("vazio");
  const contagem = { total:0, page:0, xhr:0, asset:0, external:0 };
  let filtroTexto = "", filtroTipo = "", filtroStatus = "";

  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const classeStatus = s => "st-" + (s>=500?5 : s>=400?4 : s>=300?3 : s>=200?2 : 0);

  function atualizarContadores() {
    $("c-total").textContent = contagem.total;
    for (const k of ["page","xhr","asset","external"]) $("c-"+k).textContent = contagem[k];
  }

  function visivel(tr) {
    const okTipo = !filtroTipo || tr.dataset.kind === filtroTipo;
    const okTexto = !filtroTexto || tr.dataset.url.includes(filtroTexto);
    const okStatus = !filtroStatus || tr.dataset.sc === filtroStatus;
    return okTipo && okTexto && okStatus;
  }

  function adicionar(r) {
    contagem.total++;
    if (contagem[r.kind] !== undefined) contagem[r.kind]++;
    atualizarContadores();
    if (!$("seed").textContent && r.url) {
      try { $("seed").textContent = new URL(r.url).origin; } catch {}
    }

    const tr = document.createElement("tr");
    tr.dataset.kind = r.kind || "";
    tr.dataset.url = (r.url || "").toLowerCase();
    tr.dataset.sc = classeStatus(r.status).slice(3); // "2".."5" ou "0"
    tr.innerHTML =
      `<td class="metodo">${esc(r.method||"GET")}</td>` +
      `<td><span class="badge k-${esc(r.kind)}">${esc(r.kind)}</span></td>` +
      `<td class="url">${esc(r.url)}${r.title ? `<div style="color:var(--muted)">${esc(r.title)}</div>`:""}</td>` +
      `<td class="src">${esc(r.source_url||"—")}</td>` +
      `<td class="status ${classeStatus(r.status)}">${r.status || "—"}</td>`;
    if (!visivel(tr)) tr.style.display = "none";
    corpo.appendChild(tr);
    if (contagem.total > 0) vazio.style.display = "none";
  }

  function aplicarFiltro() {
    for (const tr of corpo.children) tr.style.display = visivel(tr) ? "" : "none";
  }

  $("busca").addEventListener("input", e => { filtroTexto = e.target.value.trim().toLowerCase(); aplicarFiltro(); });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    for (const c of $("chips").children) c.setAttribute("aria-pressed", c === b ? "true" : "false");
    filtroTipo = b.dataset.k; aplicarFiltro();
  });
  $("chips-status").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    for (const c of $("chips-status").children) c.setAttribute("aria-pressed", c === b ? "true" : "false");
    filtroStatus = b.dataset.s; aplicarFiltro();
  });

  function status(txt, cls) { $("statusTxt").textContent = txt; $("dot").className = "dot " + cls; }

  // estado inicial do SQLite
  fetch("api/routes").then(r => r.json()).then(rotas => {
    rotas.forEach(adicionar);
  }).catch(() => {});

  // fluxo ao vivo
  const es = new EventSource("events");
  es.onopen = () => status("ao vivo", "ao-vivo");
  es.onerror = () => status("reconectando…", "erro");
  es.onmessage = ev => { try { adicionar(JSON.parse(ev.data)); } catch {} };
})();
</script>
</body>
</html>
